# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: chrono-deck-t22-spire
    runtime: docker
    plan: free
    region: singapore
    branch: feature/t22-v02-game-shell
    dockerfilePath: ./chatgpt-app/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CHRONO_DATA_DIR
        value: /tmp/chrono-deck
      - key: CHRONO_PUBLIC_URL
        fromService:
          type: web
          name: chrono-deck-t22-spire
          envVarKey: RENDER_EXTERNAL_URL
