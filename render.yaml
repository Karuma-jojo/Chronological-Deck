# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: chrono-deck-t22-spire
    runtime: docker
    plan: free
    region: singapore
    branch: feature/t22-v02-game-shell
    dockerfilePath: ./chatgpt-app/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CHRONO_ARCHIVE_REPO
        value: Karuma-jojo/Chronological-Deck
      - key: CHRONO_ARCHIVE_BRANCH
        value: t22-archive
      - key: CHRONO_ARCHIVE_PREFIX
        value: archive
      - key: CHRONO_GITHUB_TOKEN
        sync: false
