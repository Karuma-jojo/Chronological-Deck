name: T22 rich module 28 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 28 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-28.js
          node --input-type=module --check < scripts/validate-t22-rich-module-28.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 28 rich contract
        run: node scripts/validate-t22-rich-module-28.mjs
      - name: Verify module 28 registry wiring
        run: |
          grep -q 'buildT22RichModule28' js/data/t22-rich-syllabus.js
          grep -q 'ARC534: MODULE_28' js/data/t22-rich-syllabus.js
          grep -q 'T22-M28-A08' js/data/t22-rich-module-28.js
