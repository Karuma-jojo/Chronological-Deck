name: One-time World Registry split

on:
  push:
    branches:
      - agent/editable-arc-foundation

permissions:
  contents: write

jobs:
  split-world:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editable-arc-foundation

      - name: Move WORLD registry into shared data module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          source = app_path.read_text()
          first, sep, rest = source.partition('\n')
          if not sep:
              raise SystemExit('app.js did not contain the expected WORLD line plus application code')

          if first.startswith('import { WORLD } from "./data/world.js";'):
              print('WORLD registry already split.')
          else:
              prefix = 'const WORLD = '
              if not first.startswith(prefix) or not first.endswith(';'):
                  raise SystemExit('Expected app.js first line to contain const WORLD = {...};')
              registry = first[len(prefix):-1]
              Path('js/data').mkdir(parents=True, exist_ok=True)
              Path('js/data/world.js').write_text(f'export const WORLD = {registry};\n')
              app_path.write_text('import { WORLD } from "./data/world.js";\n' + rest)
          PY

      - name: Validate module syntax and wiring
        shell: bash
        run: |
          node --input-type=module --check < js/app.js
          node --input-type=module --check < js/data/world.js
          node --input-type=module --check < js/data/arc-store.js
          node --input-type=module --check < js/vault.js
          grep -q 'type="module" src="./js/app.js"' index.html
          grep -q 'type="module" src="./js/vault.js"' index.html
          grep -q 'id="vaultTab"' index.html

      - name: Commit World Registry module
        shell: bash
        run: |
          if git diff --quiet -- js/app.js js/data/world.js; then
            echo "No registry split changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/data/world.js
          git commit -m "separate stable World Registry data"
          git push origin HEAD:agent/editable-arc-foundation
