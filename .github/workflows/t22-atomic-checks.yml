name: T22 atomic curriculum checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-atomic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate T22 atomic JavaScript syntax
        shell: bash
        run: |
          node --input-type=module --check < js/data/t22-atomic-arcs.js
          node --input-type=module --check < js/data/t22-rich-module-2.js
          node --input-type=module --check < js/data/t22-rich-module-3.js
          node --input-type=module --check < js/data/t22-rich-module-4.js
          node --input-type=module --check < js/data/t22-rich-module-5.js
          node --input-type=module --check < js/data/t22-rich-module-6.js
          node --input-type=module --check < js/data/t22-rich-module-7.js
          node --input-type=module --check < js/data/t22-rich-module-8.js
          node --input-type=module --check < js/data/t22-rich-module-9.js
          node --input-type=module --check < js/data/t22-rich-module-10.js
          node --input-type=module --check < js/data/t22-rich-module-11.js
          node --input-type=module --check < js/data/t22-rich-module-12.js
          node --input-type=module --check < js/data/t22-rich-module-13.js
          node --input-type=module --check < js/data/t22-rich-module-14.js
          node --input-type=module --check < js/data/t22-rich-module-15.js
          node --input-type=module --check < js/data/t22-rich-module-16.js
          node --input-type=module --check < js/data/t22-rich-module-17.js
          node --input-type=module --check < js/data/t22-rich-module-18.js
          node --input-type=module --check < js/data/t22-rich-syllabus.js
          node --input-type=module --check < js/t22-atomic-ui.js
          node --input-type=module --check < js/site-v12.js
          node --input-type=module --check < js/site-v11.js
          node --input-type=module --check < scripts/validate-t22-atomic.mjs
          node --input-type=module --check < scripts/validate-t22-rich-syllabus.mjs
          node --input-type=module --check < chatgpt-app/lib/catalog.js

      - name: Validate content-derived T22 curriculum
        run: node scripts/validate-t22-atomic.mjs

      - name: Validate rich T22 syllabus contracts
        run: node scripts/validate-t22-rich-syllabus.mjs

      - name: Validate T22 audit-v2 bootstrap wiring
        shell: bash
        run: |
          grep -q 't22-atomic-arcs.js?v=1.7.0' js/site-v12.js
          grep -q 't22-atomic-ui.js?v=1.7.0' js/site-v12.js
          grep -q 'site-v12.js?v=1.7.0' js/site-v11.js
          grep -q 'atomicIds.size !== 596' js/data/t22-atomic-arcs.js
          grep -q 'T22_ATOMIC_AUDIT_VERSION = "2.0"' js/data/t22-atomic-arcs.js
          grep -q 'chrono_t22_atomic_progress_v2' js/t22-atomic-ui.js
          grep -q 'no per-module arc cap' js/t22-atomic-ui.js
          grep -q 'T22_RICH_SYLLABUS_VERSION = "3.0"' js/data/t22-rich-syllabus.js
          grep -q 'SIDE263: MODULE_2' js/data/t22-rich-syllabus.js
          grep -q 'ARC510: MODULE_3' js/data/t22-rich-syllabus.js
          grep -q 'ARC511: MODULE_4' js/data/t22-rich-syllabus.js
          grep -q 'SIDE276: MODULE_5' js/data/t22-rich-syllabus.js
          grep -q 'SIDE278: MODULE_6' js/data/t22-rich-syllabus.js
          grep -q 'SIDE279: MODULE_7' js/data/t22-rich-syllabus.js
          grep -q 'SIDE280: MODULE_8' js/data/t22-rich-syllabus.js
          grep -q 'SIDE267: MODULE_9' js/data/t22-rich-syllabus.js
          grep -q 'SIDE271: MODULE_10' js/data/t22-rich-syllabus.js
          grep -q 'ARC711: MODULE_11' js/data/t22-rich-syllabus.js
          grep -q 'ARC512: MODULE_12' js/data/t22-rich-syllabus.js
          grep -q 'ARC515: MODULE_13' js/data/t22-rich-syllabus.js
          grep -q 'ARC717: MODULE_14' js/data/t22-rich-syllabus.js
          grep -q 'ARC585: MODULE_15' js/data/t22-rich-syllabus.js
          grep -q 'ARC713: MODULE_16' js/data/t22-rich-syllabus.js
          grep -q 'ARC048: MODULE_17' js/data/t22-rich-syllabus.js
          grep -q 'SIDE476: MODULE_18' js/data/t22-rich-syllabus.js
          grep -q 'T22-M02-A04' js/data/t22-rich-module-2.js
          grep -q 'T22-M03-A08' js/data/t22-rich-module-3.js
          grep -q 'T22-M04-A05' js/data/t22-rich-module-4.js
          grep -q 'T22-M05-A08' js/data/t22-rich-module-5.js
          grep -q 'T22-M06-A04' js/data/t22-rich-module-6.js
          grep -q 'T22-M07-A07' js/data/t22-rich-module-7.js
          grep -q 'T22-M08-A09' js/data/t22-rich-module-8.js
          grep -q 'T22-M09-A05' js/data/t22-rich-module-9.js
          grep -q 'T22-M10-A07' js/data/t22-rich-module-10.js
          grep -q 'T22-M11-A08' js/data/t22-rich-module-11.js
          grep -q 'T22-M12-A08' js/data/t22-rich-module-12.js
          grep -q 'T22-M13-A11' js/data/t22-rich-module-13.js
          grep -q 'T22-M14-A10' js/data/t22-rich-module-14.js
          grep -q 'T22-M15-A09' js/data/t22-rich-module-15.js
          grep -q 'T22-M16-A08' js/data/t22-rich-module-16.js
          grep -q 'T22-M17-A06' js/data/t22-rich-module-17.js
          grep -q 'T22-M18-A05' js/data/t22-rich-module-18.js
          grep -q 'Copy mission card' js/t22-atomic-ui.js
