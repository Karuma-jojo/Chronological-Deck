name: T22 atomic curriculum checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-atomic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate T22 atomic JavaScript syntax
        shell: bash
        run: |
          node --input-type=module --check < js/data/t22-atomic-arcs.js
          node --input-type=module --check < js/data/t22-rich-module-2.js
          node --input-type=module --check < js/data/t22-rich-module-3.js
          node --input-type=module --check < js/data/t22-rich-module-4.js
          node --input-type=module --check < js/data/t22-rich-syllabus.js
          node --input-type=module --check < js/t22-atomic-ui.js
          node --input-type=module --check < js/site-v12.js
          node --input-type=module --check < js/site-v11.js
          node --input-type=module --check < scripts/validate-t22-atomic.mjs
          node --input-type=module --check < scripts/validate-t22-rich-syllabus.mjs
          node --input-type=module --check < chatgpt-app/lib/catalog.js

      - name: Validate content-derived T22 curriculum
        run: node scripts/validate-t22-atomic.mjs

      - name: Validate rich T22 syllabus contracts
        run: node scripts/validate-t22-rich-syllabus.mjs

      - name: Validate T22 audit-v2 bootstrap wiring
        shell: bash
        run: |
          grep -q 't22-atomic-arcs.js?v=1.7.0' js/site-v12.js
          grep -q 't22-atomic-ui.js?v=1.7.0' js/site-v12.js
          grep -q 'site-v12.js?v=1.7.0' js/site-v11.js
          grep -q 'atomicIds.size !== 596' js/data/t22-atomic-arcs.js
          grep -q 'T22_ATOMIC_AUDIT_VERSION = "2.0"' js/data/t22-atomic-arcs.js
          grep -q 'chrono_t22_atomic_progress_v2' js/t22-atomic-ui.js
          grep -q 'no per-module arc cap' js/t22-atomic-ui.js
          grep -q 'T22_RICH_SYLLABUS_VERSION = "3.0"' js/data/t22-rich-syllabus.js
          grep -q 'SIDE263: MODULE_2' js/data/t22-rich-syllabus.js
          grep -q 'ARC510: MODULE_3' js/data/t22-rich-syllabus.js
          grep -q 'ARC511: MODULE_4' js/data/t22-rich-syllabus.js
          grep -q 'T22-M02-A04' js/data/t22-rich-module-2.js
          grep -q 'T22-M03-A08' js/data/t22-rich-module-3.js
          grep -q 'T22-M04-A05' js/data/t22-rich-module-4.js
          grep -q 'Copy mission card' js/t22-atomic-ui.js
