name: T22 atomic curriculum checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-atomic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate T22 atomic JavaScript syntax
        shell: bash
        run: |
          node --input-type=module --check < js/data/t22-atomic-arcs.js
          node --input-type=module --check < js/t22-atomic-ui.js
          node --input-type=module --check < js/site-v12.js
          node --input-type=module --check < js/site-v11.js
          node --input-type=module --check < scripts/validate-t22-atomic.mjs

      - name: Validate weighted T22 curriculum
        run: node scripts/validate-t22-atomic.mjs

      - name: Validate T22 bootstrap wiring
        shell: bash
        run: |
          grep -q 't22-atomic-arcs.js?v=1.6.0' js/site-v12.js
          grep -q 't22-atomic-ui.js?v=1.6.0' js/site-v12.js
          grep -q 'site-v12.js?v=1.6.0' js/site-v11.js
          grep -q 'T22_ATOMIC_COUNT !== 187\|atomicIds.size !== 187' js/data/t22-atomic-arcs.js
          grep -q 'chrono_t22_atomic_progress_v1' js/t22-atomic-ui.js
          grep -q 'T22: 58 modules' js/t22-atomic-ui.js
