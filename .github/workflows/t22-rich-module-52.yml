name: T22 rich module 52 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 52 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-52.js
          node --input-type=module --check < scripts/validate-t22-rich-module-52.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 52 rich contract
        run: node scripts/validate-t22-rich-module-52.mjs
      - name: Verify module 52 registry wiring
        run: |
          grep -q 'buildT22RichModule52' js/data/t22-rich-syllabus.js
          grep -q 'ARC714: MODULE_52' js/data/t22-rich-syllabus.js
          grep -q 'T22-M52-A14' js/data/t22-rich-module-52.js
