name: T22 rich module 57 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-57:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 57 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-57.js
          node --input-type=module --check < scripts/validate-t22-rich-module-57.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 57 rich contract
        run: node scripts/validate-t22-rich-module-57.mjs
      - name: Verify module 57 registry wiring
        run: |
          grep -q 'buildT22RichModule57' js/data/t22-rich-syllabus.js
          grep -q 'ARC559: MODULE_57' js/data/t22-rich-syllabus.js
          grep -q 'T22-M57-A14' js/data/t22-rich-module-57.js
