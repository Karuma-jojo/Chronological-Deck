name: T22 rich module 48 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-48:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 48 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-48.js
          node --input-type=module --check < scripts/validate-t22-rich-module-48.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 48 rich contract
        run: node scripts/validate-t22-rich-module-48.mjs
      - name: Verify module 48 registry wiring
        run: |
          grep -q 'buildT22RichModule48' js/data/t22-rich-syllabus.js
          grep -q 'ARC594: MODULE_48' js/data/t22-rich-syllabus.js
          grep -q 'T22-M48-A14' js/data/t22-rich-module-48.js
