name: T22 Elite checks

on:
  push:
    branches: [codex/t22-m06-whole-curriculum,codex/t22-coherence-game-theory-repairs,codex/t22-pedagogical-rebuild, codex/t22-m15-publication, codex/t22-m04-v2-review-repair, codex/t22-m04-v2-final-confirmation, codex/t22-m04-28-session-rebuild, codex/t22-m05-whole-curriculum-rebuild, codex/t22-m05-deep-source-restart, codex/t22-m05-final-confirmation-sol, codex/t22-m03-six-tools-upgrade, codex/t22-m03-v2-review-repair-r1, main]
    paths:
      - 'course/t22/**'
      - 'js/t22-course/**'
      - 't22-course.html'
      - 'css/t22-course.css'
      - 'scripts/test-t22-elite-*.mjs'
      - 'scripts/test-t22-semantic-gates.mjs'
      - 'docs/t22-rebuild/**'
      - 'docs/t22-course/**'
      - '.github/workflows/t22-elite-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          node --check docs/t22-course/audit/m06-v2-checks.mjs
          node --check scripts/test-t22-elite-m06-v2-browser.mjs
          node --check js/t22-course/supplements.js
          node --check scripts/test-t22-elite-coherence-repairs.mjs
          node --check scripts/test-t22-elite-coherence-browser.mjs
          node --check js/t22-course/core.js
          node --check js/t22-course/overrides.js
          node --check js/t22-course/representations.js
          node --check js/t22-course/ui.js
          node --check scripts/test-t22-elite-m01.mjs
          node --check scripts/test-t22-elite-m02.mjs
          node --check scripts/test-t22-elite-m03.mjs
          node --check scripts/test-t22-elite-m03-v2-pilot.mjs
          node --check scripts/test-t22-elite-m04.mjs
          node --check scripts/test-t22-elite-m04-browser.mjs
          node --check scripts/test-t22-elite-m05.mjs
          node --check scripts/test-t22-elite-m05-v2-browser.mjs
          node --check scripts/test-t22-elite-m06.mjs
          node --check scripts/test-t22-elite-m07.mjs
          node --check scripts/test-t22-elite-m09.mjs
          node --check scripts/test-t22-elite-m10.mjs
          node --check scripts/test-t22-elite-m11.mjs
          node --check scripts/test-t22-elite-m12.mjs
          node --check scripts/test-t22-elite-m13.mjs
          node --check scripts/test-t22-elite-m14.mjs
          node --check scripts/test-t22-elite-m15.mjs
          node --check docs/t22-course/audit/m15-math-checks.mjs
          node --check docs/t22-course/audit/m14-math-checks.mjs
          node --check docs/t22-course/audit/m14-instruction-math-checks.mjs
          node --check docs/t22-course/audit/m14-handoff-checks.mjs
          node --check scripts/test-t22-elite-m11-browser.mjs
          node --check scripts/test-t22-elite-m12-browser.mjs
          node --check scripts/test-t22-elite-m13-browser.mjs
          node --check scripts/test-t22-elite-m14-browser.mjs
          node --check scripts/test-t22-elite-m15-browser.mjs
          node --check scripts/test-t22-elite-m09-browser.mjs
          node --check docs/t22-course/audit/m09-math-checks.mjs
          node --check docs/t22-course/audit/m10-math-checks.mjs
          node --check docs/t22-course/audit/m11-math-checks.mjs
          node --check docs/t22-course/audit/m12-math-checks.mjs
          node --check docs/t22-course/audit/m12-instruction-math-checks.mjs
          node --check docs/t22-course/audit/m12-handoff-checks.mjs
          node --check docs/t22-course/audit/m11-handoff-checks.mjs
          node --check scripts/test-t22-elite-m08.mjs
          node --check scripts/test-t22-elite-m05-m06-repairs.mjs
          node --check scripts/test-t22-elite-repair-browser.mjs
          node --check docs/t22-course/audit/m05-m06-semantic-checks.mjs
          node --check docs/t22-course/audit/m05-m06-transfer-math.mjs
          node --check scripts/test-t22-semantic-gates.mjs
          node --check scripts/test-t22-elite-course-browser.mjs
          node --check docs/t22-rebuild/audit/check-current.mjs
          node --check docs/t22-course/audit/m02-review-checks.mjs
          node --check docs/t22-course/audit/m03-handoff-checks.mjs
          node --check docs/t22-course/audit/m03-independent-math.mjs
          node --check docs/t22-course/audit/m03-v2-independent-math.mjs
          node --check docs/t22-course/audit/m03-v2-clone-audit.mjs
          node --check docs/t22-course/audit/m03-v2-final-microcleanup.mjs
          node --check docs/t22-course/audit/m03-v2-review-repair-r1.mjs
          node --check docs/t22-course/audit/m04-independent-math.mjs
          node --check docs/t22-course/audit/m04-handoff-checks.mjs
          node --check docs/t22-course/audit/m05-candidate-math.mjs
          node --check docs/t22-course/audit/m05-independent-math.mjs
          node --check docs/t22-course/audit/m05-handoff-checks.mjs
          node --check docs/t22-course/audit/m06-independent-math.mjs
          node --check docs/t22-course/audit/m06-handoff-checks.mjs
          node --check docs/t22-course/audit/m07-independent-math.mjs
          node --check docs/t22-course/audit/m07-handoff-checks.mjs
          node --check docs/t22-course/audit/m07-astra-repair-checks.mjs
          node --check docs/t22-course/audit/m08-independent-oracles.mjs
          node --check docs/t22-course/audit/m08-handoff-checks.mjs
          node --check docs/t22-course/audit/m03-repair-checks.mjs
      - name: Structural, pedagogy, semantic and evidence regressions
        run: |
          node docs/t22-course/audit/m06-v2-checks.mjs
          python3 docs/t22-course/audit/m06-v2-adversarial-math.py
          python3 course/t22/labs/m06-finite-evidence-lab.py
          node scripts/test-t22-elite-coherence-repairs.mjs
          node scripts/test-t22-elite-m01.mjs
          node scripts/test-t22-elite-m02.mjs
          node scripts/test-t22-elite-m03.mjs
          node scripts/test-t22-elite-m03-v2-pilot.mjs
          node scripts/test-t22-elite-m04.mjs
          node scripts/test-t22-elite-m05.mjs
          node scripts/test-t22-elite-m06.mjs
          node scripts/test-t22-elite-m07.mjs
          node scripts/test-t22-elite-m09.mjs
          node scripts/test-t22-elite-m10.mjs
          node scripts/test-t22-elite-m11.mjs
          node scripts/test-t22-elite-m12.mjs
          node scripts/test-t22-elite-m13.mjs
          node scripts/test-t22-elite-m14.mjs
          node scripts/test-t22-elite-m15.mjs
          node docs/t22-course/audit/m15-math-checks.mjs
          node docs/t22-course/audit/m14-math-checks.mjs
          node docs/t22-course/audit/m14-instruction-math-checks.mjs
          node docs/t22-course/audit/m14-handoff-checks.mjs
          node docs/t22-course/audit/m09-math-checks.mjs
          node docs/t22-course/audit/m10-math-checks.mjs
          node docs/t22-course/audit/m11-math-checks.mjs
          node docs/t22-course/audit/m12-math-checks.mjs
          node docs/t22-course/audit/m12-instruction-math-checks.mjs
          node docs/t22-course/audit/m12-handoff-checks.mjs
          node docs/t22-course/audit/m11-handoff-checks.mjs
          node scripts/test-t22-elite-m08.mjs
          node scripts/test-t22-elite-m05-m06-repairs.mjs
          node docs/t22-course/audit/m05-m06-transfer-math.mjs
          node scripts/test-t22-semantic-gates.mjs
          node docs/t22-rebuild/audit/check-current.mjs
          node docs/t22-course/audit/m02-review-checks.mjs
          node docs/t22-course/audit/m03-handoff-checks.mjs
          node docs/t22-course/audit/m03-independent-math.mjs
          node docs/t22-course/audit/m03-v2-independent-math.mjs
          node docs/t22-course/audit/m03-v2-clone-audit.mjs
          node docs/t22-course/audit/m03-v2-final-microcleanup.mjs
          node docs/t22-course/audit/m03-v2-review-repair-r1.mjs
          node docs/t22-course/audit/m04-independent-math.mjs
          node docs/t22-course/audit/m04-handoff-checks.mjs
          node docs/t22-course/audit/m05-independent-math.mjs
          node docs/t22-course/audit/m05-handoff-checks.mjs
          node docs/t22-course/audit/m06-independent-math.mjs
          node docs/t22-course/audit/m06-handoff-checks.mjs
          node docs/t22-course/audit/m07-independent-math.mjs
          node docs/t22-course/audit/m07-handoff-checks.mjs
          node docs/t22-course/audit/m07-astra-repair-checks.mjs
          node docs/t22-course/audit/m08-independent-oracles.mjs
          node docs/t22-course/audit/m08-handoff-checks.mjs
          node docs/t22-course/audit/m03-repair-checks.mjs
      - name: Install browser-test dependency
        run: npm ci --prefix scripts/review-tests
      - name: Install Chromium
        run: node scripts/review-tests/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Browser evidence workflow
        run: |
          node scripts/test-t22-elite-m06-v2-browser.mjs
          node scripts/test-t22-elite-coherence-browser.mjs
          node scripts/test-t22-elite-course-browser.mjs
          node scripts/test-t22-elite-m04-browser.mjs
          node scripts/test-t22-elite-m05-v2-browser.mjs
          node scripts/test-t22-elite-m11-browser.mjs
          node scripts/test-t22-elite-m12-browser.mjs
          node scripts/test-t22-elite-m13-browser.mjs
          node scripts/test-t22-elite-m14-browser.mjs
          node scripts/test-t22-elite-m15-browser.mjs
      - name: Package M03 v2 r3 deliverable
        if: github.ref == 'refs/heads/codex/t22-m03-six-tools-upgrade'
        uses: actions/upload-artifact@v4
        with:
          name: T22-Elite-M03-v2.0-r3-finished
          if-no-files-found: error
          path: |
            docs/t22-course/artifacts/T22-Elite-M03-Master-Pack-v2.0-r3.md
            course/t22/authoring/m03.json
            docs/t22-course/M03-V2-FINAL-MICROCLEANUP.md

      - name: Package M03 v2 r4 repair deliverable
        if: github.ref == 'refs/heads/codex/t22-m03-v2-review-repair-r1'
        uses: actions/upload-artifact@v4
        with:
          name: T22-Elite-M03-v2.0-r4-review-repair
          if-no-files-found: error
          path: |
            docs/t22-course/artifacts/T22-Elite-M03-Master-Pack-v2.0-r4.md
            course/t22/authoring/m03.json
            docs/t22-course/M03-V2-INDEPENDENT-ADVERSARIAL-REVIEW-r1.md
            docs/t22-course/M03-V2-STRATEGY-LABS.md
