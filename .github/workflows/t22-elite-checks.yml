name: T22 Elite checks

on:
  push:
    branches: [codex/t22-pedagogical-rebuild, main]
    paths:
      - 'course/t22/**'
      - 'js/t22-course/**'
      - 't22-course.html'
      - 'css/t22-course.css'
      - 'scripts/test-t22-elite-*.mjs'
      - 'scripts/test-t22-semantic-gates.mjs'
      - 'docs/t22-rebuild/**'
      - 'docs/t22-course/**'
      - '.github/workflows/t22-elite-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          node --check js/t22-course/core.js
          node --check js/t22-course/overrides.js
          node --check js/t22-course/ui.js
          node --check scripts/test-t22-elite-m01.mjs
          node --check scripts/test-t22-elite-m02.mjs
          node --check scripts/test-t22-elite-m03.mjs
          node --check scripts/test-t22-elite-m04.mjs
          node --check scripts/test-t22-elite-m05.mjs
          node --check scripts/test-t22-elite-m06.mjs
          node --check scripts/test-t22-elite-m07.mjs
          node --check scripts/test-t22-elite-m09.mjs
          node --check scripts/test-t22-elite-m10.mjs
          node --check scripts/test-t22-elite-m09-browser.mjs
          node --check docs/t22-course/audit/m09-math-checks.mjs
          node --check docs/t22-course/audit/m10-math-checks.mjs
          node --check scripts/test-t22-elite-m08.mjs
          node --check scripts/test-t22-elite-m05-m06-repairs.mjs
          node --check scripts/test-t22-elite-repair-browser.mjs
          node --check docs/t22-course/audit/m05-m06-semantic-checks.mjs
          node --check docs/t22-course/audit/m05-m06-transfer-math.mjs
          node --check scripts/test-t22-semantic-gates.mjs
          node --check scripts/test-t22-elite-course-browser.mjs
          node --check docs/t22-rebuild/audit/check-current.mjs
          node --check docs/t22-course/audit/m02-review-checks.mjs
          node --check docs/t22-course/audit/m03-handoff-checks.mjs
          node --check docs/t22-course/audit/m03-independent-math.mjs
          node --check docs/t22-course/audit/m04-independent-math.mjs
          node --check docs/t22-course/audit/m04-handoff-checks.mjs
          node --check docs/t22-course/audit/m05-independent-math.mjs
          node --check docs/t22-course/audit/m05-handoff-checks.mjs
          node --check docs/t22-course/audit/m06-independent-math.mjs
          node --check docs/t22-course/audit/m06-handoff-checks.mjs
          node --check docs/t22-course/audit/m07-independent-math.mjs
          node --check docs/t22-course/audit/m07-handoff-checks.mjs
          node --check docs/t22-course/audit/m07-astra-repair-checks.mjs
          node --check docs/t22-course/audit/m08-independent-oracles.mjs
          node --check docs/t22-course/audit/m08-handoff-checks.mjs
          node --check docs/t22-course/audit/m03-repair-checks.mjs
      - name: Structural, pedagogy, semantic and evidence regressions
        run: |
          node scripts/test-t22-elite-m01.mjs
          node scripts/test-t22-elite-m02.mjs
          node scripts/test-t22-elite-m03.mjs
          node scripts/test-t22-elite-m04.mjs
          node scripts/test-t22-elite-m05.mjs
          node scripts/test-t22-elite-m06.mjs
          node scripts/test-t22-elite-m07.mjs
          node scripts/test-t22-elite-m09.mjs
          node scripts/test-t22-elite-m10.mjs
          node docs/t22-course/audit/m09-math-checks.mjs
          node docs/t22-course/audit/m10-math-checks.mjs
          node scripts/test-t22-elite-m08.mjs
          node scripts/test-t22-elite-m05-m06-repairs.mjs
          node docs/t22-course/audit/m05-m06-transfer-math.mjs
          node scripts/test-t22-semantic-gates.mjs
          node docs/t22-rebuild/audit/check-current.mjs
          node docs/t22-course/audit/m02-review-checks.mjs
          node docs/t22-course/audit/m03-handoff-checks.mjs
          node docs/t22-course/audit/m03-independent-math.mjs
          node docs/t22-course/audit/m04-independent-math.mjs
          node docs/t22-course/audit/m04-handoff-checks.mjs
          node docs/t22-course/audit/m05-independent-math.mjs
          node docs/t22-course/audit/m05-handoff-checks.mjs
          node docs/t22-course/audit/m06-independent-math.mjs
          node docs/t22-course/audit/m06-handoff-checks.mjs
          node docs/t22-course/audit/m07-independent-math.mjs
          node docs/t22-course/audit/m07-handoff-checks.mjs
          node docs/t22-course/audit/m07-astra-repair-checks.mjs
          node docs/t22-course/audit/m08-independent-oracles.mjs
          node docs/t22-course/audit/m08-handoff-checks.mjs
          node docs/t22-course/audit/m03-repair-checks.mjs
      - name: Install browser-test dependency
        run: npm ci --prefix scripts/review-tests
      - name: Install Chromium
        run: node scripts/review-tests/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Browser evidence workflow
        run: node scripts/test-t22-elite-course-browser.mjs
