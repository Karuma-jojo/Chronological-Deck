name: T22 rich module 47 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 47 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-47.js
          node --input-type=module --check < scripts/validate-t22-rich-module-47.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 47 rich contract
        run: node scripts/validate-t22-rich-module-47.mjs
      - name: Verify module 47 registry wiring
        run: |
          grep -q 'buildT22RichModule47' js/data/t22-rich-syllabus.js
          grep -q 'ARC593: MODULE_47' js/data/t22-rich-syllabus.js
          grep -q 'T22-M47-A13' js/data/t22-rich-module-47.js
