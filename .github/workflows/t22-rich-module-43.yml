name: T22 rich module 43 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-43:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 43 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-43.js
          node --input-type=module --check < scripts/validate-t22-rich-module-43.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 43 rich contract
        run: node scripts/validate-t22-rich-module-43.mjs
      - name: Verify module 43 registry wiring
        run: |
          grep -q 'buildT22RichModule43' js/data/t22-rich-syllabus.js
          grep -q 'ARC586: MODULE_43' js/data/t22-rich-syllabus.js
          grep -q 'T22-M43-A16' js/data/t22-rich-module-43.js
