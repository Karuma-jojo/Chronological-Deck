name: T22 M05 v2 review

on:
  push:
    branches: [codex/t22-m05-whole-curriculum-rebuild]
    paths:
      - 'course/t22/authoring/m05.json'
      - 'js/t22-course/**'
      - 'css/t22-course.css'
      - 't22-course.html'
      - 'scripts/test-t22-elite-m05*.mjs'
      - 'docs/t22-course/M05-*.md'
      - 'docs/t22-course/audit/m05-*'
      - '.github/workflows/t22-m05-v2-review.yml'
  workflow_dispatch:

jobs:
  validate-m05:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M05 syntax, structural, semantic, math and provenance checks
        run: |
          node --check docs/t22-course/audit/m05-candidate-math.mjs
          node --check scripts/test-t22-elite-m05-v2-browser.mjs
          node scripts/test-t22-elite-m05.mjs
          node docs/t22-course/audit/m05-candidate-math.mjs
          node docs/t22-course/audit/m05-independent-math.mjs
          node docs/t22-course/audit/m05-m06-transfer-math.mjs
          node scripts/test-t22-elite-m05-m06-repairs.mjs
          node docs/t22-course/audit/m05-handoff-checks.mjs
      - name: Install browser-test dependency
        run: npm ci --prefix scripts/review-tests
      - name: Install Chromium
        run: node scripts/review-tests/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: All 28 learner positions, 56 assessment surfaces and prior evidence workflow
        run: node scripts/test-t22-elite-m05-v2-browser.mjs
