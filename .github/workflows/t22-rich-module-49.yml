name: T22 rich module 49 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-49:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 49 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-49.js
          node --input-type=module --check < scripts/validate-t22-rich-module-49.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 49 rich contract
        run: node scripts/validate-t22-rich-module-49.mjs
      - name: Verify module 49 registry wiring
        run: |
          grep -q 'buildT22RichModule49' js/data/t22-rich-syllabus.js
          grep -q 'ARC595: MODULE_49' js/data/t22-rich-syllabus.js
          grep -q 'T22-M49-A14' js/data/t22-rich-module-49.js
