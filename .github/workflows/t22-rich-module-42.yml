name: T22 rich module 42 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 42 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-42.js
          node --input-type=module --check < scripts/validate-t22-rich-module-42.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 42 rich contract
        run: node scripts/validate-t22-rich-module-42.mjs
      - name: Verify module 42 registry wiring
        run: |
          grep -q 'buildT22RichModule42' js/data/t22-rich-syllabus.js
          grep -q 'ARC582: MODULE_42' js/data/t22-rich-syllabus.js
          grep -q 'T22-M42-A13' js/data/t22-rich-module-42.js
