name: Archive search quality checks
on:
  pull_request:
    paths:
      - 'supabase/arc-search-quality-v2.sql'
      - 'supabase/tests/arc-search-quality-v2*'
      - 'scripts/*archive-search*'
      - 'scripts/fixtures/archive-search-benchmark-v2.json'
      - '.github/workflows/archive-search-quality-checks.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/arc-search-quality-v2.sql'
      - 'supabase/tests/arc-search-quality-v2*'
      - 'scripts/*archive-search*'
      - 'scripts/fixtures/archive-search-benchmark-v2.json'
      - '.github/workflows/archive-search-quality-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: archive_search_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: archive_search_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-archive-search-quality-v2.mjs
      - run: node scripts/test-logical-authority-v1.mjs
      - name: Execute migration and isolation/ranking tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/arc-search-quality-v2-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/arc-search-quality-v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/arc-search-quality-v2.test.sql
