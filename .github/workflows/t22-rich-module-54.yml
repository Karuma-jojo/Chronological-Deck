name: T22 rich module 54 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-54:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 54 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-54.js
          node --input-type=module --check < scripts/validate-t22-rich-module-54.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 54 rich contract
        run: node scripts/validate-t22-rich-module-54.mjs
      - name: Verify module 54 registry wiring
        run: |
          grep -q 'buildT22RichModule54' js/data/t22-rich-syllabus.js
          grep -q 'ARC553: MODULE_54' js/data/t22-rich-syllabus.js
          grep -q 'T22-M54-A12' js/data/t22-rich-module-54.js
