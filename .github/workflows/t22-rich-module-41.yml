name: T22 rich module 41 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 41 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-41.js
          node --input-type=module --check < scripts/validate-t22-rich-module-41.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 41 rich contract
        run: node scripts/validate-t22-rich-module-41.mjs
      - name: Verify module 41 registry wiring
        run: |
          grep -q 'buildT22RichModule41' js/data/t22-rich-syllabus.js
          grep -q 'ARC581: MODULE_41' js/data/t22-rich-syllabus.js
          grep -q 'T22-M41-A12' js/data/t22-rich-module-41.js
