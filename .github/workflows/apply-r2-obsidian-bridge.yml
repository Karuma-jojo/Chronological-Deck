name: Apply R2 Obsidian bridge patch

on:
  push:
    branches:
      - agent/r2-obsidian-media-bridge
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-obsidian-media-bridge
      - name: Apply deterministic bridge patch
        run: python3 scripts/patch-obsidian-r2-bridge.py
      - name: Validate patched JavaScript
        run: node --check obsidian-plugin/main.js
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obsidian-plugin/main.js obsidian-plugin/manifest.json .github/workflows/frontend-checks.yml
          git commit -m "Wire Obsidian ARC media sync to R2"
          git push origin HEAD:agent/r2-obsidian-media-bridge
