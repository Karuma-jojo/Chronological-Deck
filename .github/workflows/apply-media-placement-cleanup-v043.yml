name: Apply media placement cleanup v0.4.3

on:
  push:
    branches:
      - agent/media-placement-cleanup-v043
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-placement-cleanup-v043
      - name: Apply deterministic patch
        run: python3 scripts/patch-media-placement-cleanup-v043.py
      - name: Validate JavaScript
        run: |
          node --check obsidian-plugin/main.js
          node --check chatgpt-app/media-gateway.js
      - name: Commit patched runtime files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obsidian-plugin/main.js obsidian-plugin/manifest.json chatgpt-app/media-gateway.js docs/obsidian-bridge.md
          git commit -m "Track ARC media placement and add safe cloud cleanup"
          git push origin HEAD:agent/media-placement-cleanup-v043
