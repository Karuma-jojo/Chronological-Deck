name: One-time Obsidian v0.2 upgrade

on:
  push:
    branches:
      - agent/obsidian-sync-v2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/obsidian-sync-v2
      - name: Apply v0.2 bridge patch
        run: python3 scripts/upgrade-obsidian-v2-once.py
      - name: Validate plugin syntax
        run: node --check obsidian-plugin/main.js
      - name: Commit generated plugin update
        shell: bash
        run: |
          if git diff --quiet -- obsidian-plugin/main.js; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add obsidian-plugin/main.js
          git commit -m 'Upgrade Obsidian bridge to bidirectional sync'
          git push origin HEAD:agent/obsidian-sync-v2
