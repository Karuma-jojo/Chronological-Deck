name: T22 rich module 38 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-38:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 38 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-38.js
          node --input-type=module --check < scripts/validate-t22-rich-module-38.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 38 rich contract
        run: node scripts/validate-t22-rich-module-38.mjs
      - name: Verify module 38 registry wiring
        run: |
          grep -q 'buildT22RichModule38' js/data/t22-rich-syllabus.js
          grep -q 'ARC524: MODULE_38' js/data/t22-rich-syllabus.js
          grep -q 'T22-M38-A10' js/data/t22-rich-module-38.js
