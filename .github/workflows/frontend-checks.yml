name: Frontend integrity checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript module syntax
        shell: bash
        run: |
          node --input-type=module --check < js/app.js
          node --input-type=module --check < js/data/world.js
          node --input-type=module --check < js/data/arc-store.js
          node --input-type=module --check < js/data/supabase-arc-store.js
          node --input-type=module --check < js/data/hybrid-arc-store.js
          node --input-type=module --check < js/data/markdown-arc.js
          node --input-type=module --check < js/vault-cloud-ui.js
          node --input-type=module --check < js/vault-reader.js
          node --input-type=module --check < js/vault.js
          node --check obsidian-plugin/main.js

      - name: Validate World Registry graph integrity
        run: node scripts/validate-world.mjs

      - name: Validate Markdown ARC round-trip
        run: node scripts/test-markdown.mjs

      - name: Validate GitHub Pages entrypoint wiring
        shell: bash
        run: |
          grep -q 'href="./css/app.css"' index.html
          grep -q 'href="./css/vault.css"' index.html
          grep -q 'type="module" src="./js/app.js"' index.html
          grep -q 'type="module" src="./js/vault.js"' index.html
          grep -q 'import "./vault-reader.js";' js/vault-cloud-ui.js
          grep -q 'id="vaultTab"' index.html
          test -f supabase/arc-vault.sql

      - name: Validate Obsidian bridge contract
        shell: bash
        run: |
          test -f supabase/obsidian-bridge.sql
          test -f docs/obsidian-bridge.md
          test -f obsidian-plugin/manifest.json
          grep -q '"id": "chrono-deck-bridge"' obsidian-plugin/manifest.json
          grep -q 'chrono_sync_obsidian_arc' supabase/obsidian-bridge.sql
          grep -q 'SecretStorage' obsidian-plugin/README.md
