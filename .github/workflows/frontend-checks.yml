name: Frontend integrity checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript module syntax
        shell: bash
        run: |
          node --input-type=module --check < js/app.js
          node --input-type=module --check < js/data/world.js
          node --input-type=module --check < js/data/law-node.js
          node --input-type=module --check < js/data/law-foundations.js
          node --input-type=module --check < js/data/law-jurisprudence.js
          node --input-type=module --check < js/data/law-public.js
          node --input-type=module --check < js/data/law-private.js
          node --input-type=module --check < js/data/law-procedure.js
          node --input-type=module --check < js/data/law-advanced.js
          node --input-type=module --check < js/data/law-expansion.js
          node --input-type=module --check < js/data/arc-store.js
          node --input-type=module --check < js/data/supabase-arc-store.js
          node --input-type=module --check < js/data/hybrid-arc-store.js
          node --input-type=module --check < js/data/markdown-arc.js
          node --input-type=module --check < js/vault-cloud-ui.js
          node --input-type=module --check < js/vault-reader.js
          node --input-type=module --check < js/vault.js
          node --check obsidian-plugin/main.js

      - name: Validate World Registry graph integrity
        run: node scripts/validate-world.mjs

      - name: Validate Markdown ARC round-trip
        run: node scripts/test-markdown.mjs

      - name: Validate GitHub Pages entrypoint wiring
        shell: bash
        run: |
          grep -q 'href="./css/app.css"' index.html
          grep -q 'href="./css/vault.css"' index.html
          grep -q 'href="./css/black-theme.css"' index.html
          grep -q 'href="./css/vault-reader-v4.css"' index.html
          grep -q 'type="module" src="./js/data/law-expansion.js"' index.html
          grep -q 'type="module" src="./js/app.js"' index.html
          grep -q 'type="module" src="./js/vault.js"' index.html
          grep -q 'import "./vault-reader.js";' js/vault-cloud-ui.js
          grep -q 'id="vaultTab"' index.html
          grep -q 'Explore all 710' index.html
          test -f css/black-theme.css
          test -f css/vault-reader-v4.css
          test -f js/data/law-expansion.js
          test -f docs/t21-law-route.md
          test -f supabase/arc-vault.sql

      - name: Validate Obsidian bridge contract
        shell: bash
        run: |
          test -f supabase/obsidian-bridge.sql
          test -f supabase/obsidian-sync-v2.sql
          test -f supabase/obsidian-reader-v3.sql
          test -f docs/obsidian-bridge.md
          test -f obsidian-plugin/manifest.json
          test -f obsidian-plugin/styles.css
          grep -q '"id": "chrono-deck-bridge"' obsidian-plugin/manifest.json
          grep -q '"version": "0.3.0"' obsidian-plugin/manifest.json
          grep -q 'chrono_sync_obsidian_arc' supabase/obsidian-bridge.sql
          grep -q 'chrono_sync_obsidian_arc_v2' supabase/obsidian-sync-v2.sql
          grep -q 'chrono_load_obsidian_arc' supabase/obsidian-sync-v2.sql
          grep -q 'chrono_prune_arc_revisions' supabase/obsidian-reader-v3.sql
          grep -q 'chrono_arc_revision_stats' supabase/obsidian-reader-v3.sql
          grep -q 'pull-all-arcs' obsidian-plugin/main.js
          grep -q 'open-arc-reader' obsidian-plugin/main.js
          grep -q 'normalize-current-arc-math' obsidian-plugin/main.js
          grep -q 'chrono_prune_arc_revisions' obsidian-plugin/main.js
          grep -q 'MarkdownRenderer.render' obsidian-plugin/main.js
          grep -q 'SecretStorage' obsidian-plugin/README.md
