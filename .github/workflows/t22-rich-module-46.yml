name: T22 rich module 46 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-46:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 46 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-46.js
          node --input-type=module --check < scripts/validate-t22-rich-module-46.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 46 rich contract
        run: node scripts/validate-t22-rich-module-46.mjs
      - name: Verify module 46 registry wiring
        run: |
          grep -q 'buildT22RichModule46' js/data/t22-rich-syllabus.js
          grep -q 'ARC590: MODULE_46' js/data/t22-rich-syllabus.js
          grep -q 'T22-M46-A14' js/data/t22-rich-module-46.js
