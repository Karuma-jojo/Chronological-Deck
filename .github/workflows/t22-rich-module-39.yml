name: T22 rich module 39 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 39 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-39.js
          node --input-type=module --check < scripts/validate-t22-rich-module-39.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 39 rich contract
        run: node scripts/validate-t22-rich-module-39.mjs
      - name: Verify module 39 registry wiring
        run: |
          grep -q 'buildT22RichModule39' js/data/t22-rich-syllabus.js
          grep -q 'ARC525: MODULE_39' js/data/t22-rich-syllabus.js
          grep -q 'T22-M39-A09' js/data/t22-rich-module-39.js
