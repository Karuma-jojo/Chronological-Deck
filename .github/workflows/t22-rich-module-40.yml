name: T22 rich module 40 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 40 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-40.js
          node --input-type=module --check < scripts/validate-t22-rich-module-40.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 40 rich contract
        run: node scripts/validate-t22-rich-module-40.mjs
      - name: Verify module 40 registry wiring
        run: |
          grep -q 'buildT22RichModule40' js/data/t22-rich-syllabus.js
          grep -q 'ARC514: MODULE_40' js/data/t22-rich-syllabus.js
          grep -q 'T22-M40-A08' js/data/t22-rich-module-40.js
