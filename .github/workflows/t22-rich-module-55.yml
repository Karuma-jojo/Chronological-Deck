name: T22 rich module 55 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 55 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-55.js
          node --input-type=module --check < scripts/validate-t22-rich-module-55.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 55 rich contract
        run: node scripts/validate-t22-rich-module-55.mjs
      - name: Verify module 55 registry wiring
        run: |
          grep -q 'buildT22RichModule55' js/data/t22-rich-syllabus.js
          grep -q 'ARC554: MODULE_55' js/data/t22-rich-syllabus.js
          grep -q 'T22-M55-A16' js/data/t22-rich-module-55.js
