name: One-time frontend modularization

on:
  push:
    branches:
      - agent/modularize-frontend

permissions:
  contents: write

jobs:
  split-monolith:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modularize-frontend

      - name: Extract inline CSS and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text()

          style_open = '<style>\n'
          style_close = '\n</style>'
          script_open = '<script>\n'
          script_close = '\n</script>'

          if source.count(style_open) != 1 or source.count(style_close) != 1:
              raise SystemExit('Expected exactly one inline <style> block')
          if source.count(script_open) != 1 or source.count(script_close) != 1:
              raise SystemExit('Expected exactly one inline <script> block')

          css = source.split(style_open, 1)[1].split(style_close, 1)[0]
          js = source.split(script_open, 1)[1].split(script_close, 1)[0]

          html = source.replace(
              style_open + css + style_close,
              '<link rel="stylesheet" href="./css/app.css">',
              1,
          )
          html = html.replace(
              script_open + js + script_close,
              '<script src="./js/app.js"></script>',
              1,
          )

          Path('css').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('css/app.css').write_text(css + '\n')
          Path('js/app.js').write_text(js + '\n')
          path.write_text(html)

          rebuilt = html.replace(
              '<link rel="stylesheet" href="./css/app.css">',
              style_open + css + style_close,
              1,
          ).replace(
              '<script src="./js/app.js"></script>',
              script_open + js + script_close,
              1,
          )
          if rebuilt != source:
              raise SystemExit('Round-trip validation failed')
          PY

      - name: Validate JavaScript syntax
        run: node --check js/app.js

      - name: Commit extracted files
        shell: bash
        run: |
          if git diff --quiet -- index.html css/app.css js/app.js; then
            echo "No modularization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/app.css js/app.js
          git commit -m "modularize frontend assets"
          git push origin HEAD:agent/modularize-frontend
