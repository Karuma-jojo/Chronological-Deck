name: T22 rich module 32 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 32 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-32.js
          node --input-type=module --check < scripts/validate-t22-rich-module-32.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 32 rich contract
        run: node scripts/validate-t22-rich-module-32.mjs
      - name: Verify module 32 registry wiring
        run: |
          grep -q 'buildT22RichModule32' js/data/t22-rich-syllabus.js
          grep -q 'ARC508: MODULE_32' js/data/t22-rich-syllabus.js
          grep -q 'T22-M32-A11' js/data/t22-rich-module-32.js
