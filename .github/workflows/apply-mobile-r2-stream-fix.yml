name: Apply mobile R2 stream fix

on:
  push:
    branches:
      - agent/mobile-r2-stream-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-r2-stream-fix
      - name: Apply deterministic patch
        run: python3 scripts/patch-mobile-r2-stream.py
      - name: Validate JavaScript
        run: |
          node --check obsidian-plugin/main.js
          node --check chatgpt-app/media-gateway.js
      - name: Commit patched runtime files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obsidian-plugin/main.js obsidian-plugin/manifest.json chatgpt-app/media-gateway.js
          git commit -m "Fix mobile R2 media stream handling"
          git push origin HEAD:agent/mobile-r2-stream-fix
