name: T22 rich module 31 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 31 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-31.js
          node --input-type=module --check < scripts/validate-t22-rich-module-31.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 31 rich contract
        run: node scripts/validate-t22-rich-module-31.mjs
      - name: Verify module 31 registry wiring
        run: |
          grep -q 'buildT22RichModule31' js/data/t22-rich-syllabus.js
          grep -q 'ARC507: MODULE_31' js/data/t22-rich-syllabus.js
          grep -q 'T22-M31-A09' js/data/t22-rich-module-31.js
