name: T22 rich module 36 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 36 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-36.js
          node --input-type=module --check < scripts/validate-t22-rich-module-36.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 36 rich contract
        run: node scripts/validate-t22-rich-module-36.mjs
      - name: Verify module 36 registry wiring
        run: |
          grep -q 'buildT22RichModule36' js/data/t22-rich-syllabus.js
          grep -q 'ARC542: MODULE_36' js/data/t22-rich-syllabus.js
          grep -q 'T22-M36-A16' js/data/t22-rich-module-36.js
