name: T22 rich module 34 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 34 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-34.js
          node --input-type=module --check < scripts/validate-t22-rich-module-34.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 34 rich contract
        run: node scripts/validate-t22-rich-module-34.mjs
      - name: Verify module 34 registry wiring
        run: |
          grep -q 'buildT22RichModule34' js/data/t22-rich-syllabus.js
          grep -q 'ARC513: MODULE_34' js/data/t22-rich-syllabus.js
          grep -q 'T22-M34-A09' js/data/t22-rich-module-34.js
