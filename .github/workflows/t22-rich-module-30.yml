name: T22 rich module 30 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 30 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-30.js
          node --input-type=module --check < scripts/validate-t22-rich-module-30.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 30 rich contract
        run: node scripts/validate-t22-rich-module-30.mjs
      - name: Verify module 30 registry wiring
        run: |
          grep -q 'buildT22RichModule30' js/data/t22-rich-syllabus.js
          grep -q 'ARC506: MODULE_30' js/data/t22-rich-syllabus.js
          grep -q 'T22-M30-A08' js/data/t22-rich-module-30.js
