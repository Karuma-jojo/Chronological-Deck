name: T22 rich module 37 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 37 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-37.js
          node --input-type=module --check < scripts/validate-t22-rich-module-37.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 37 rich contract
        run: node scripts/validate-t22-rich-module-37.mjs
      - name: Verify module 37 registry wiring
        run: |
          grep -q 'buildT22RichModule37' js/data/t22-rich-syllabus.js
          grep -q 'ARC543: MODULE_37' js/data/t22-rich-syllabus.js
          grep -q 'T22-M37-A12' js/data/t22-rich-module-37.js
