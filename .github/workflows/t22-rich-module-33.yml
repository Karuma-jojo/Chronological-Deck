name: T22 rich module 33 checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-t22-rich-module-33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module 33 JavaScript syntax
        run: |
          node --input-type=module --check < js/data/t22-rich-module-33.js
          node --input-type=module --check < scripts/validate-t22-rich-module-33.mjs
          node --input-type=module --check < js/data/t22-rich-syllabus.js
      - name: Validate module 33 rich contract
        run: node scripts/validate-t22-rich-module-33.mjs
      - name: Verify module 33 registry wiring
        run: |
          grep -q 'buildT22RichModule33' js/data/t22-rich-syllabus.js
          grep -q 'ARC509: MODULE_33' js/data/t22-rich-syllabus.js
          grep -q 'T22-M33-A08' js/data/t22-rich-module-33.js
